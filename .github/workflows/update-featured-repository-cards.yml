name: Update featured repository cards

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-featured-repository-cards.yml"
      - "profile/README.md"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - sdk-go
          - sdk-java
          - sdk-typescript
          - sdk-python
          - sdk-dotnet
          - sdk-ruby
          - sdk-rust
          - sdk-php
          - cli
          - ai-cookbook
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate light card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=temporalio&repo=${{ matrix.repository }}&show_icons=true&theme=default
          path: profile/repository-cards/${{ matrix.repository }}-light.svg
          core_version: 2.1.3
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=temporalio&repo=${{ matrix.repository }}&show_icons=true&theme=dark
          path: profile/repository-cards/${{ matrix.repository }}-dark.svg
          core_version: 2.1.3
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated cards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-cards-${{ matrix.repository }}
          path: profile/repository-cards/${{ matrix.repository }}-*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Download generated cards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: repository-cards-*
          path: profile/repository-cards
          merge-multiple: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/repository-cards/*.svg
          if git diff --cached --quiet; then
            echo "Repository cards are already current."
            exit 0
          fi
          git commit -m "Update featured repository cards"
          git push origin main
