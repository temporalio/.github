name: Update featured repository cards

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-featured-repository-cards.yml"
      - ".github/scripts/generate-featured-repository-cards.py"
      - "profile/README.md"

permissions:
  contents: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate repository cards
        run: python3 .github/scripts/generate-featured-repository-cards.py

      - name: Publish cards to the profile-cards branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin profile-cards >/dev/null; then
            git fetch origin profile-cards
            git checkout -B profile-cards FETCH_HEAD
          else
            git checkout --orphan profile-cards
            git rm -rf --ignore-unmatch .
          fi
          cp profile/repository-cards/*.svg .
          git add -- *.svg
          if git diff --cached --quiet; then
            echo "Repository cards are already current."
            exit 0
          fi
          git commit -m "Update featured repository cards"
          git push origin HEAD:profile-cards
